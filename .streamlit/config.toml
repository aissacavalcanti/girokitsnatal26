[server]
# Em nuvem o Streamlit define o host/porta.
# No PC local use rodar_local.bat (força 127.0.0.1).
headless = true
enableCORS = false
enableXsrfProtection = true
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true

[theme]
base = "dark"
primaryColor = "#00E59A"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
font = "sans serif"
